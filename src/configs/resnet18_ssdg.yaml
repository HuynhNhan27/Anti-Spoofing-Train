# Data settings
data:
  data_dir: "./data/celeba-spoof-cropped-sampled/dataset"
  target_dir: "./data/fas_video_data"
  target_train_csv: "./data/fas_video_data/train.csv"
  target_val_csv: "./data/fas_video_data/val.csv"
  input_size: 224              # Standard resolution for ResNet-18
  use_fourier: false           # ResNet-18 does not use Fourier maps
  use_randaugment: true        # Enable custom SafeRandAugment search space
  ra_num_ops: 2                # Number of concurrent safe operations
  ra_magnitude: 9              # Magnitude parameter for SafeRandAugment

# Model settings
model:
  name: "resnet18"
  num_classes: 2
  pretrained: true

# Training settings
train:
  epochs: 20
  batch_size: 128
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0001
  milestones: [5, 10, 15]
  gamma: 0.1
  device: "cuda"
  save_dir: "models"
  log_dir: "runs"
  log_interval: 10
  # Early stopping settings
  early_stopping_patience: 5
  early_stopping_monitor: "tpr_at_1pct_fpr_interp"
  # Focal Loss settings
  focal_loss_gamma: 2.0
  focal_loss_alpha: null
  # GPU optimizations
  num_workers: "auto"
  torch_compile: false

  # SSDG Settings
  alpha: 0.1                 # Classification Adversarial Loss weight
  beta: 0.5                  # Asymmetric Metric Loss weight
  margin: 1.0                # Margin for Spoof Dispersion in Metric Loss
  dist_type: "mse"           # Distance metric for Metric Loss ('mse' or 'cosine' or 'euclidean')
  lambda_grl: 1.0            # Max GRL factor lambda
  dynamic_grl: true          # Dynamic GRL scaling using DANN schedule
